name: Build & Verify V12 Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Syntax check
      run: |
        node -c src/main.js
        node -c src/ui/telemetry.js
        node -c src/engine/scene3d.js
        node -c src/engine/kinematics.js
        node -c src/engine/thermodynamics.js
        node -c src/engine/audio.js

    - name: Build production bundle
      run: npm run build
